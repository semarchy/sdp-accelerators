label: Pairs without a domain-specific rule
documentation: Which domain and category pairs rely only on generic rules (rules scoped to any domain)? A gap means no in-force rule was written for that domain in that category. Rules column = generic rules that still apply.
chartType: PIVOT_TABLE
pivotQuery:
  query: DomainCategoryCoverage
  showRowTotals: false
  showColumnTotals: false
  rows:
  - name: Domain
    attribute: Domain
  - name: Category
    attribute: Category
  columns: []
  measures:
  - name: GenericRules
    attribute: GenericRules
  measuresLocation: LAST_ROW
  additionalParameters: []
labelPlacement: TOP
filters:
- attribute: Covered
  operator: EQUALS
  value: 'No'
dataLabels: {}
enableDrilldown: true
