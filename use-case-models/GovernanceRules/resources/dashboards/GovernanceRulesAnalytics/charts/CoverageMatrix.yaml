label: Domain-specific rules by domain
documentation: How many in-force rules are written for each data domain? Generic rules (scoped to any domain) are not counted. A domain at zero relies on generic rules only; see the pairs without a domain-specific rule below for the categories.
chartType: BAR
pivotQuery:
  query: DomainCategoryCoverage
  showRowTotals: false
  showColumnTotals: false
  rows:
  - name: Domain
    attribute: Domain
  columns: []
  measures:
  - name: DomainRules
    attribute: DomainRules
  measuresLocation: LAST_ROW
  additionalParameters: []
labelPlacement: TOP
filters: []
dataLabels: {}
enableDrilldown: true
